plugins {
    alias(libs.plugins.antora)
    alias(libs.plugins.io.spring.antora.generate.yml)
}

apply from: "${rootDir}/gradle/docs.gradle"
apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'kotlin'
apply plugin: 'kotlin-spring'

description = 'Spring Kafka Code Snippets For Docs'


tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = JavaVersion.VERSION_17
    options.encoding = 'UTF-8'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompilationTask).configureEach {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        javaParameters = true
        allWarningsAsErrors = true
    }
}

configurations {
	[compileClasspath, runtimeClasspath, testCompileClasspath, testRuntimeClasspath].each {
		it.extendsFrom(dependencyManagement)
	}
}

dependencies {
    implementation libs.org.springframework.boot.starter
    implementation project (':spring-kafka')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
    implementation 'tools.jackson.core:jackson-databind'
}

